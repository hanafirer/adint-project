{% extends 'layout.html' %}
{% block content %}
<h1>Print exams</h1>
{% if message %}<p>{{ message }}</p>{% endif %}
<form action="/print" method="post">
    Exam: <select name="exam_id">
        {% for e in exams %}
        <option value="{{ e.id }}">{{ e.id }} - {{ e.course }} - ({{ e.date }})</option>
        {% endfor %}
    </select>
    <input type="submit" value="Order printing">
</form>
{% endblock %}
