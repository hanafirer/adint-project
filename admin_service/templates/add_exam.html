{% extends 'layout.html' %}
{% block content %}
<h1>Add exam</h1>
{% if error %}<p style="color: red;">{{ error }}</p>{% endif %}
<form action="/exams/add" method="post">
    DateTime: <input type="datetime-local" name="date" required><br>
    Course: <input type="text" name="course" required><br>
    <input type="submit">
</form>
{% endblock %}
